name: Build Offline Music APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JetNews

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Auto-format and Build Debug APK
        run: ./gradlew assembleDebug -x spotlessCheck -x spotlessKotlinCheck -x spotlessKotlinApply

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMusicApp
          path: JetNews/app/build/outputs/apk/debug/app-debug.apk
